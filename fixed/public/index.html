<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPA Lab — Fixed</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="nav"></header>
  <main id="app"></main>

  <!-- Inline bootstrap-скрипт с nonce (демонстрация работы nonce в CSP) -->
  <script nonce="__NONCE__">
    window.__APP_CONFIG__ = { version: '1.0.0', name: 'SPA Lab Fixed' };
  </script>

  <!-- Внешний скрипт тоже защищён через nonce -->
  <script nonce="__NONCE__" src="/app.js"></script>
</body>
</html>
